# CMake build + rigorous regression gate against the legacy build system.
#
# Strategy: build and test Loci TWICE on the same runner -- once with the
# original ./configure + GNU make flow (the reference), once with CMake --
# then require strict parity: identical installed file sets, byte-identical
# headers and generated conf files, identical quickTest results, and identical
# behavior of a compiled consumer application. Any drift between the new CMake
# build and the original fails this workflow.
name: CMake build and legacy parity

on:
  push:
    branches: [dev, stable41]
  pull_request:
    branches: [dev, stable41]
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'   # Mondays: catch dependency/base-image drift

permissions:
  contents: read

concurrency:
  group: cmake-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # The core regression gate: legacy build == CMake build.
  # -----------------------------------------------------------------------
  parity:
    name: legacy vs CMake artifact and test parity
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git tags are needed for version.conf/version_info.h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build openmpi-bin libopenmpi-dev \
            libhdf5-dev libxml2-dev hdf5-tools gfortran zlib1g-dev

      # The legacy build sed-embeds `git describe` output directly into
      # Config/version_info.h and fails to compile when no tag is reachable
      # (LOCI_VERSION_MAJOR becomes the raw hash). Tag HEAD ephemerally so
      # both build systems see identical version info, exactly like a release
      # checkout; a no-op whenever any tag is already reachable.
      - name: Ensure a reachable version tag
        run: git describe --tags --abbrev=0 >/dev/null 2>&1 || git tag v0.0.0-ci

      # Reference build: original configure/make. Ubuntu's libhdf5-dev puts
      # the serial library in the multiarch dir, so point HDF5 at /usr
      # explicitly (both build systems implement the Debian serial-HDF5
      # branch). install_minimal is used because 'make install' additionally
      # requires pdflatex to build the tutorial; it installs the same files.
      - name: Legacy configure
        run: |
          ./configure --no-sub-dir --no-metis \
            --hdf5-dir=/usr --prefix="$PWD/install-legacy"
      - name: Legacy build + install
        run: make -j"$(nproc)" install_minimal
      - name: Legacy quickTest (make test)
        run: bash cmake/ci/run_logged.sh legacy-make-test make test
      - name: Legacy quickTest gate
        run: |
          echo "--- aggregated results ---"
          cat OBJ/quickTest/TestResults || true
          if grep -q FAIL OBJ/quickTest/TestResults; then
            echo "::error::legacy quickTest has failures"; exit 1
          fi

      - name: CMake configure
        run: |
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-cmake" \
            -DLOCI_HDF5_DIR=/usr -DLOCI_NO_METIS=ON -DLOCI_NO_SUB_DIR=ON
      - name: CMake build + install
        run: |
          cmake --build build-cmake -j"$(nproc)"
          cmake --install build-cmake
      - name: CMake quickTest (ctest)
        run: >
          bash cmake/ci/run_logged.sh cmake-ctest ctest
          --test-dir build-cmake -L quicktest --output-on-failure

      - name: Parity gate (installed trees, conf files, test results)
        run: |
          bash cmake/ci/parity_check.sh \
            --legacy-obj OBJ --cmake-build build-cmake \
            --legacy-prefix install-legacy --cmake-prefix install-cmake

      - name: Consumer check (heat tutorial app vs both install trees)
        run: |
          bash cmake/ci/consumer_check.sh install-legacy install-cmake

      - name: Uninstall / reinstall round trip (re-runs parity gate)
        run: |
          cmake --build build-cmake --target uninstall
          if [ -n "$(ls -A install-cmake 2>/dev/null)" ]; then
            echo "::error::uninstall left files behind:"
            find install-cmake -type f | head
            exit 1
          fi
          cmake --install build-cmake
          bash cmake/ci/parity_check.sh \
            --legacy-obj OBJ --cmake-build build-cmake \
            --legacy-prefix install-legacy --cmake-prefix install-cmake

      - name: Upload quickTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicktest-results
          path: |
            OBJ/quickTest/*/TestResults
            build-cmake/quickTest/*/TestResults
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # --nompi (stub MPI) configuration: build, install, smoke-test.
  # -----------------------------------------------------------------------
  nompi:
    name: nompi stub build and serial smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build libhdf5-dev libxml2-dev gfortran zlib1g-dev

      - name: CMake configure (LOCI_MPI=OFF, serial HDF5)
        run: |
          cmake -S . -B build-nompi -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-nompi" \
            -DLOCI_MPI=OFF -DLOCI_HDF5_DIR=/usr \
            -DLOCI_NO_METIS=ON -DLOCI_NO_SUB_DIR=ON
      - name: Build + install
        run: |
          cmake --build build-nompi -j"$(nproc)"
          cmake --install build-nompi
      - name: serial launcher installed and sys.conf matches legacy nompi text
        run: |
          # shellcheck disable=SC2016  # $(LOCI_BASE) is literal conf text, not shell
          test -x install-nompi/bin/mpinorun
          grep -q 'MPI_RUN = $(LOCI_BASE)/bin/mpinorun' install-nompi/sys.conf
          grep -q 'MPI_INCLUDE = -DMPI_STUBB -I$(LOCI_BASE)/include/MPI_stubb' \
            install-nompi/sys.conf
      - name: Serial quickTest suites (make wrapper, like legacy usage)
        run: |
          cd build-nompi/quickTest
          make Containers FVMModUnitTests Tools \
            LOCI_BASE="$PWD/.." TEST_BASE="$PWD"
          grep -h . ./*/TestResults | tee /dev/stderr
          ! grep -q FAIL ./*/TestResults
      - name: Serial consumer smoke (heat built vs install tree, run serial)
        run: |
          cp -r install-nompi/docs/heat heat-serial
          cd heat-serial
          make LOCI_BASE="$GITHUB_WORKSPACE/install-nompi" -j"$(nproc)"
          "$GITHUB_WORKSPACE/install-nompi/bin/mpinorun" ./heat test \
            | tee heat.log
          grep -q '^R10:' heat.log
          test -s output/temperature_sca.10_test

  # -----------------------------------------------------------------------
  # Config matrix: options that change generated code must still build and
  # pass the unit-test suites under BOTH build systems.
  # -----------------------------------------------------------------------
  variants:
    name: bounds-check (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        build: [legacy, cmake]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build openmpi-bin libopenmpi-dev \
            libhdf5-dev libxml2-dev hdf5-tools gfortran zlib1g-dev

      - name: Ensure a reachable version tag (legacy build requires one)
        if: matrix.build == 'legacy'
        run: git describe --tags --abbrev=0 >/dev/null 2>&1 || git tag v0.0.0-ci

      - name: Legacy build (--bounds-check) and unit suites
        if: matrix.build == 'legacy'
        run: |
          bash cmake/ci/run_logged.sh bc-legacy bash -c '
            set -e
            ./configure --no-sub-dir --no-metis --bounds-check \
              --hdf5-dir=/usr --prefix="$PWD/install-bc"
            make -j"$(nproc)" default
            cd OBJ/quickTest
            make Containers Tools FVMModUnitTests FVM \
              LOCI_BASE="$PWD/.." TEST_BASE="$PWD"
            ! grep -hq FAIL ./*/TestResults
          '

      - name: CMake build (-DLOCI_BOUNDS_CHECK=ON) and unit suites
        if: matrix.build == 'cmake'
        run: |
          bash cmake/ci/run_logged.sh bc-cmake bash -c '
            set -e
            cmake -S . -B build-bc -G Ninja \
              -DLOCI_BOUNDS_CHECK=ON \
              -DCMAKE_INSTALL_PREFIX="$PWD/install-bc" \
              -DLOCI_HDF5_DIR=/usr -DLOCI_NO_METIS=ON -DLOCI_NO_SUB_DIR=ON
            cmake --build build-bc -j"$(nproc)"
            ctest --test-dir build-bc -L quicktest \
              -R "quickTest\\.(Containers|Tools|FVMModUnitTests|FVM)$" \
              --output-on-failure
          '

  # -----------------------------------------------------------------------
  # Packaging: source tarball from the git tree (CD artifact).
  # -----------------------------------------------------------------------
  dist:
    name: source tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build openmpi-bin libopenmpi-dev \
            libhdf5-dev libxml2-dev gfortran zlib1g-dev
      - name: Configure (minimal, for the tarball target)
        # -DLOCI_HDF5_DIR=/usr mirrors configure's --hdf5-dir=/usr: without
        # hdf5-tools/hdf5-helpers on PATH neither build system can
        # auto-detect Debian's multiarch serial HDF5 layout.
        run: >
          bash cmake/ci/run_logged.sh dist-configure cmake
          -S . -B build-dist -G Ninja
          -DLOCI_HDF5_DIR=/usr -DLOCI_NO_METIS=ON
      - name: Build tarball
        run: >
          bash cmake/ci/run_logged.sh dist-tarball cmake
          --build build-dist --target tarball
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: loci-source-tarball
          path: Loci-*.tgz
